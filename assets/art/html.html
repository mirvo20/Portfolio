<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .badge {
    width: 100%; height: 100%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #f16529 50%, #e44d26 50%);
    color: #fff;
    font: 700 34vw/1 'Courier New', monospace;
    letter-spacing: -.08em;
  }
  .badge::after { content: '</>'; }
</style>
</head>
<body>
  <div class="badge"></div>
</body>
</html>
